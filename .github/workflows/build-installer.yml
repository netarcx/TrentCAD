name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a release even when package.json version is unchanged (e.g. re-running a failed build)'
        type: boolean
        default: false

jobs:
  # Gate the entire build/release pipeline on a real version bump.
  # Trent's convention is to bump package.json's patch digit on every
  # push that should ship; this job enforces it so a stream of small
  # commits doesn't trigger three full electron-builder matrices per
  # push. Manual `workflow_dispatch` with `force=true` overrides the
  # gate for re-runs of a failed build.
  detect-bump:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: check
        shell: bash
        run: |
          NEW=$(node -p "require('./package.json').version")
          OLD=$(git show HEAD~1:package.json 2>/dev/null | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{ try { console.log(JSON.parse(s).version) } catch { console.log('') } })" || echo "")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "force=true → releasing v$NEW"
          elif [ -z "$OLD" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "first commit (no previous package.json) → releasing v$NEW"
          elif [ "$OLD" != "$NEW" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version bumped: $OLD → $NEW → releasing"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version unchanged ($NEW) → skipping release. Bump package.json + server/package.json to publish."
          fi

  # Compute which platforms to build for this run. All three (Windows,
  # macOS, Linux) on every push and on manual dispatch — Trent's
  # production install base spans all three (Windows for the CAD
  # workflow, Mac for design review, Linux for the team server admin
  # box). GitHub Actions doesn't allow `matrix` in job-level `if:`, so
  # we compute it dynamically here and let `release` consume it via
  # `fromJSON`.
  prepare-matrix:
    needs: detect-bump
    if: needs.detect-bump.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - id: compute
        run: |
          echo 'matrix={"include":[{"os":"windows-2022","platform":"win"},{"os":"macos-latest","platform":"mac"},{"os":"ubuntu-latest","platform":"linux"}]}' >> "$GITHUB_OUTPUT"

  # Pre-create the GitHub Release (idempotent) BEFORE the matrix runs.
  # Without this, all three matrix jobs race to POST /releases and two
  # of them die with HTTP 422 "already_exists" — electron-builder
  # doesn't retry on that error. By guaranteeing the release exists
  # before any matrix job starts, electron-builder's GET succeeds on
  # every job and they all happily upload assets to the same release.
  prepare-release:
    needs: detect-bump
    if: needs.detect-bump.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Ensure GitHub Release v${{ steps.version.outputs.version }} exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — matrix jobs will upload to it."
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes "Auto-built from ${{ github.sha }}"
            echo "Created release $tag."
          fi

  release:
    needs: [detect-bump, prepare-matrix, prepare-release]
    if: needs.detect-bump.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # SolidWorks add-in only builds on Windows (the SW interop assemblies
      # are Windows-specific and the add-in only loads inside SolidWorks).
      # Mac and Linux are admin-only builds — they get the Electron app
      # without the SW add-in.
      - uses: actions/setup-dotnet@v5
        if: matrix.platform == 'win'
        with:
          dotnet-version: '8.x'

      - name: Stamp add-in version from package.json
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Strip any prerelease suffix (e.g. "0.7.14-rc.1" -> "0.7.14")
          # because AssemblyVersion requires strict W.X.Y.Z numeric and
          # dotnet build errors on "Invalid Version Format" otherwise
          $numeric = $v -replace '-.*$', ''
          # AssemblyVersion uses W.X.Y.Z; package.json is W.X.Y so we append .0
          $stamp = "$numeric.0"
          $f = 'solidworks-addin/FrameCAD.SolidWorksAddin/Properties/AssemblyInfo.cs'
          $c = Get-Content $f -Raw
          $c = $c -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$stamp`")"
          $c = $c -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$stamp`")"
          Set-Content -Path $f -Value $c -NoNewline
          Write-Host "Stamped add-in AssemblyVersion=$stamp (from package.json version $v)"

      - name: Build SolidWorks add-in
        if: matrix.platform == 'win'
        run: dotnet publish solidworks-addin/FrameCAD.SolidWorksAddin/FrameCAD.SolidWorksAddin.csproj -c Release -o build/solidworks-addin

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npx electron-vite build && npx electron-builder --config electron-builder.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build-time defaults baked into the installer. GitHub Actions
          # secret names stay TRENTCAD_* so they don't need to be re-added
          # post-rename; the build code now reads FRAMECAD_*, so we
          # bridge the two here. Rename the secrets if/when convenient.
          FRAMECAD_ADMIN_PIN_HASH: ${{ secrets.TRENTCAD_ADMIN_PIN_HASH }}
          FRAMECAD_DEFAULT_GITHUB_ORG: ${{ secrets.TRENTCAD_DEFAULT_GITHUB_ORG }}
          FRAMECAD_DEFAULT_PROJECT_PREFIX: ${{ secrets.TRENTCAD_DEFAULT_PROJECT_PREFIX }}
          FRAMECAD_DEFAULT_TEAM_NAME: ${{ secrets.TRENTCAD_DEFAULT_TEAM_NAME }}
          FRAMECAD_DEFAULT_WELCOME_MESSAGE: ${{ secrets.TRENTCAD_DEFAULT_WELCOME_MESSAGE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FRAMECAD_GOOGLE_SHARED_DRIVE_IDS: ${{ secrets.FRAMECAD_GOOGLE_SHARED_DRIVE_IDS }}

      - name: Upload Windows installer artifact
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v5
        with:
          name: FrameCAD-Installer-Windows
          path: |
            dist/*.exe
            !dist/*-uninstaller-*.exe
          retention-days: 90

      - name: Upload macOS installer artifact
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v5
        with:
          name: FrameCAD-Installer-macOS
          path: dist/*.dmg
          retention-days: 90

      - name: Upload Linux installer artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v5
        with:
          name: FrameCAD-Installer-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 90

      - name: Upload add-in artifact
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v5
        with:
          name: FrameCAD-SolidWorksAddin
          path: build/solidworks-addin/
          retention-days: 90

  # Team server image — pushed to GitHub Container Registry when the
  # package.json version bumps, tagged with that version + `latest`.
  # Self-hosters pull this via `docker compose` or `docker run`.
  # Only depends on detect-bump — independent of the desktop matrix
  # so a Windows-build failure doesn't block the server image (and a
  # server-image failure doesn't block the desktop installer).
  server-image:
    needs: detect-bump
    if: needs.detect-bump.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push framecad-server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          # Multi-arch so self-hosters on Pi (arm64) or x86 boxes both
          # get a native image without an emulator slow-down.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/framecad-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/framecad-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
