# Local-build overlay for docker-compose.yml.
#
# Use when you've patched the team server source and want to test
# the change in a real container — `npm run dev` is fine for most
# work, but Docker is the only way to exercise the production
# Dockerfile, the multi-stage build, and the interaction with the
# giftless sidecar exactly as deployed users see it.
#
# Usage from this directory:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Or use the wrapper script in package.json:
#
#   npm run docker:dev
#
# The `image:` override below means the locally-built image gets
# tagged `framecad-server:local` so it never collides with the
# `ghcr.io/...:latest` pulled image — switch back to the production
# stack with `docker compose up -d` and compose will pull the GHCR
# version on top, no manual cleanup needed.

services:
  framecad-server:
    image: framecad-server:local
    build:
      context: .
    # Skip the GHCR pull check — we want the local build, not whatever
    # CI shipped last. The default `pull_policy: always` in the base
    # compose file would try to pull `framecad-server:local` from a
    # registry that doesn't have it and 404.
    pull_policy: build
