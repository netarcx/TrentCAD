# FrameCAD team server.
# See server/README.md for setup. Storage lives in Google Drive now —
# the team server only coordinates identity, locks, publish history,
# team config, and the Shared Drive allowlist (no LFS object store).

services:
  framecad-server:
    image: ghcr.io/netarcx/framecad-server:latest
    build:
      context: .
    container_name: framecad-server
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      - "42130:42130"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: 42130
      HOST: 0.0.0.0
      DATA_DIR: /data
      LOG_LEVEL: info
    labels:
      org.opencontainers.image.title: FrameCAD Team Server
