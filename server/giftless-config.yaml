# Giftless config for the FrameCAD self-hosted LFS server.
#
# Mounted read-only into the giftless container by docker-compose.yml.
# Operators normally don't need to touch this — set the env vars
# referenced by ${...} placeholders in `.env` instead.
#
# References:
#   - https://giftless.datopian.com/en/latest/configuration.html
#   - https://giftless.datopian.com/en/latest/auth.html

# ── Transfer adapters ────────────────────────────────────────────────
# `basic` is the standard git-lfs transfer protocol (HTTP up/download
# with separate verify call). Storage is the local filesystem, mounted
# from the host at the path Giftless writes to.
TRANSFER_ADAPTERS:
  basic:
    factory: giftless.transfer.basic_external:factory
    options:
      storage_class: giftless.storage.local_storage:LocalStorage
      storage_options:
        path: /lfs-storage

# ── Authentication ──────────────────────────────────────────────────
# Single provider: validate JWTs signed by the FrameCAD team server.
# The shared secret comes in via the env var below; Giftless reads it
# as the symmetric HMAC key. Tokens that don't match the signature are
# rejected with 401 — no fallback to anonymous access.
AUTH_PROVIDERS:
  - factory: giftless.auth.jwt:factory
    options:
      algorithm: HS256
      private_key_env: LFS_JWT_SECRET
      # Allow 10 seconds of clock skew between this container and the
      # team-server container before we reject `iat`/`exp` claims.
      leeway: 10
      # Tokens issued by the team server carry `scopes` claims; map
      # the standard LFS operations to those scope strings so a
      # read-only token (in case we ever issue one) can't write.
      scopes_claim: scopes

# Default to denying any request that doesn't authenticate above.
# Without this the legacy `null` provider would let unsigned requests
# through, which would defeat the whole point of self-hosting auth.
PRE_AUTHORIZED_ACTION_PROVIDER: null

# Trust the X-Forwarded-* headers when running behind a reverse proxy
# (e.g. a Caddy/NGINX TLS terminator). For the bare docker-compose
# layout there is no proxy and these flags are harmless.
MIDDLEWARE:
  - class: werkzeug.middleware.proxy_fix:ProxyFix
    kwargs:
      x_for: 1
      x_proto: 1
      x_host: 1
