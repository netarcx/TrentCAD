<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- FrameCAD favicon: bold geometric F on a rounded-square accent
       tile. CAD framing connotation = the hard corners; the inset F
       reads at 16px. Accent color matches --accent (#a78bfa) so it
       lines up with the rest of the brand. -->
  <rect width="64" height="64" rx="12" fill="#0f0f17"/>
  <rect x="3" y="3" width="58" height="58" rx="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <path d="M 18 14 L 18 50 L 26 50 L 26 36 L 42 36 L 42 28 L 26 28 L 26 22 L 46 22 L 46 14 Z" fill="#a78bfa"/>
</svg>
